services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"

  payment-stub:
    image: payment-stub:latest
    build:
      context: ..
      dockerfile: payment-stub/Dockerfile
    environment:
      SERVER_PORT: 8081
      # Payment Stub Settings
      STUB_PAYMENT_DECLINE_ENABLED: false
      STUB_PAYMENT_DECLINE_PROBABILITY: 0.2
      STUB_PAYMENT_AUTHORIZE_LATENCY_MIN_MILLIS: 300
      STUB_PAYMENT_AUTHORIZE_LATENCY_MAX_MILLIS: 300
      STUB_PAYMENT_CAPTURE_LATENCY_MIN_MILLIS: 300
      STUB_PAYMENT_CAPTURE_LATENCY_MAX_MILLIS: 300
      STUB_PAYMENT_EXCEPTION_ENABLED: false
      STUB_PAYMENT_EXCEPTION_PROBABILITY: 0.05
      # Warehouse Stub Settings
      STUB_WAREHOUSE_LATENCY_MIN_MILLIS: 300
      STUB_WAREHOUSE_LATENCY_MAX_MILLIS: 300
      STUB_WAREHOUSE_EXCEPTION_ENABLED: false
      STUB_WAREHOUSE_EXCEPTION_PROBABILITY: 0.05
      STUB_WAREHOUSE_FINAL_AMOUNT_MIN: 100
      STUB_WAREHOUSE_FINAL_AMOUNT_MAX: 100
    ports:
      - "8081:8081"

  order-orchestrator:
    image: order-orchestrator:latest
    build:
      context: ..
      dockerfile: order-orchestrator/Dockerfile
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orders
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: pass
      APP_CLIENTS_PAYMENT_URL: http://payment-stub:8081
      APP_CLIENTS_WAREHOUSE_URL: http://payment-stub:8081
      APP_TASK_RETRY_DELAY_SECONDS: 10
      APP_TASK_RETRYABLE_EXCEPTIONS: feign.RetryableException,java.net.SocketTimeoutException,java.io.IOException
      APP_TASK_NON_RETRYABLE_EXCEPTIONS: feign.FeignException$BadRequest,feign.FeignException$Unauthorized,feign.FeignException$Forbidden,feign.FeignException$NotFound,java.lang.IllegalArgumentException,java.lang.IllegalStateException
      APP_TASK_BATCH_SIZE: 100
      APP_TASK_PROCESSING_DELAY_MS: 1000
      APP_TASK_IN_PROGRESS_TIMEOUT_MINUTES: 5
      APP_TASK_THREAD_POOL_CORE_POOL_SIZE: 10
      APP_TASK_THREAD_POOL_MAX_POOL_SIZE: 50
      APP_TASK_THREAD_POOL_KEEP_ALIVE_SECONDS: 60
      APP_TASK_THREAD_POOL_QUEUE_CAPACITY: 1000
      APP_TASK_THREAD_POOL_AWAIT_TERMINATION_SECONDS: 120
      APP_TASK_THREAD_POOL_THREAD_NAME_PREFIX: async-task-pool-
      APP_IO_THREAD_POOL_CORE_POOL_SIZE: 5
      APP_IO_THREAD_POOL_MAX_POOL_SIZE: 25
      APP_IO_THREAD_POOL_KEEP_ALIVE_SECONDS: 30
      APP_IO_THREAD_POOL_QUEUE_CAPACITY: 100
      APP_IO_THREAD_POOL_AWAIT_TERMINATION_SECONDS: 120
      APP_IO_THREAD_POOL_THREAD_NAME_PREFIX: async-io-pool-
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - payment-stub
